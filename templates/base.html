
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TeamMatch{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{{ url_for('dashboard') if logged_in_user else url_for('login') }}">TeamMatch</a>
    <div class="nav-links">
      {% if logged_in_user %}
        <span class="nav-user">{{ logged_in_user.name }}</span>
        <a href="{{ url_for('dashboard') }}">Home</a>
        <a href="{{ url_for('learning_dashboard') }}">Learning review</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
