
{% extends "base.html" %}
{% block title %}Recruit · TeamMatch{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <div class="eyebrow">Recruit a Team</div>
    <h1>{{ competition.name }}</h1>
    <p class="muted">Create one recruiting post. Applicants will later be compared against these team needs.</p>
  </div>
</section>

<section class="card form-card">
  <form method="post">
    <label>Team / post title *</label>
    <input name="title" required placeholder="e.g. Need one data teammate">

    <label>Short description</label>
    <textarea name="description" rows="3" placeholder="What are you building and what kind of teammate do you need?"></textarea>

    <label>Needed skills *</label>
    <div class="checkbox-grid">
      {% for skill in skills %}
        <label class="check"><input type="checkbox" name="needed_skills" value="{{ skill }}"> {{ skill }}</label>
      {% endfor %}
    </div>

    <div class="two-col">
      <div>
        <label>Needed role *</label>
        <select name="needed_role" required>
          {% for item in roles %}<option>{{ item }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>Availability *</label>
        <select name="availability" required>
          {% for item in availability %}<option>{{ item }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <div class="two-col">
      <div>
        <label>Preferred working style *</label>
        <select name="working_style" required>
          {% for item in styles %}<option>{{ item }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>Project goal / expected effort *</label>
        <select name="project_goal" required>
          {% for item in goals %}<option>{{ item }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <label>Members needed *</label>
    <input name="members_needed" type="number" min="1" max="10" value="1" required>

    <button class="primary" type="submit">Publish recruiting post</button>
  </form>
</section>
{% endblock %}
